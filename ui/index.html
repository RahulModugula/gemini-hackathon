  const box=el('section','answer');box.setAttribute('aria-label','Answer');
  if(a&&a.value){
    const v=el('div','ansval');
    v.append(el('span','ansk','The current sheet says'),el('b','ansv',a.value));
    const ev=curEv(c)[0];
    if(ev)v.append(el('span','anssrc','Boxed on '+(ev.sheet_number||ev.sheet)+', '+revLabel(ev.revision)+'. Only words that sit inside the box count.'));
    box.append(v);
    if(a.text)box.append(el('p','anstext',a.text));
  }
  if(q&&q.quote){
    const qa=el('figure','addqa');
    const cap=el('figcaption');cap.append(el('b',null,q.answered_by||'Addendum'),el('span',null,q.page!=null?'Q&A, page '+q.page:'Addendum Q&A'));
    qa.append(cap,el('blockquote',null,'“'+q.quote+'”'),el('span','anssrc','Quoted word for word from the addendum; checked by code as an exact match.'));
    box.append(qa);
  }else if(c.summary)box.append(el('p','anstext',c.summary));
  if(rd&&rd.text){box.append(el('pre','rfipre mono',rd.text),el('span','anssrc','Draft only. Nothing is sent.'));}
  return box;
}

/* stage 4 of the canvas sequence: the 3D plan inside the stage. The standalone Plan3D module wins when loaded;
   otherwise the built-in three.js view (rooms from rooms.py). null = no WebGL, the stage stays flat. */
async function mountStage3d(host,card){
  const ev=curEv(card)[0]||(card.evidence||[])[0]||{};
  if(window.Plan3D&&typeof window.Plan3D.mount==='function'){
    window.Plan3D.mount(host,{sheet:ev.sheet||FLOOR_SHEET,cards,activeCardId:card.id});
    return {focus:id=>window.Plan3D.focus&&window.Plan3D.focus(id),destroy(){}};
  }
  const v=mount3D({container:host,tip:$('tip3d'),off:el('div'),focus:el('div'),getCards:()=>cards,getSelId:()=>card.id,
    onPick:id=>{selId=id;location.hash='#card='+encodeURIComponent(id);}});
  await v.start();
  if(v.failed)return null;
  return {focus(){v.update();},destroy(){}};
}

function renderDetail(animate){
  const d=$('detail');
  const c=cards.find(x=>x.id===selId)||cards[0];
  if(!c){
    if(stage){stage.destroy();stage=null;stageCard=null;}
    d.textContent='';
    const em=el('div','emptyState');
    em.append(el('b',null,'No claims checked yet'),el('span',null,'Pick a sample above or type a claim. The answer opens here on the drawing sheet.'));
    d.append(em);return;
  }
  if(stage&&stageCard===c.id&&d.querySelector('.paper')){paintRfi(c);return;}   // same card: keep the stage where it is
  if(stage){stage.destroy();stage=null;}
  d.textContent='';
  selId=c.id;
  const paper=el('article','paper');   // no entrance animation: the camera move is the one moment of motion
  const fresh=lastDetailId!==c.id;
  lastDetailId=c.id;

  const head=el('div','shead');
  const st=el('div','stamp '+(c.mode==='answer'&&!c.answer&&c.addenda_answer?'v-addenda':vCls(c.verdict)));st.append(stampWord(c));
  st.append(el('small',null,Math.round((Number(c.confidence)||0)*100)+'% confidence'));
  const ht=el('div','htext');
  ht.append(el('h2','dclaim',c.claim||''));
  const meta=el('div','meta');
  if(c.speaker)meta.append(el('span','chip',c.speaker));
  if(changedByAddendum(c))meta.append(el('span','chip amber','Changed by addendum'));
  const sp=(c.spec_refs||[]);if(sp.length)meta.append(el('span','mono','Spec '+sp.join(', ')));
  if(c.replayed)meta.append(el('span','replayed','replayed'));
  ht.append(meta);
  const act=el('div','hact');
  head.append(st,ht,act);paper.append(head);
  const blk=el('div','blkslot');paper.append(blk);
  paintRfi.act=act;paintRfi.blk=blk;
  const ans=answerBlock(c);if(ans)paper.append(ans);

  if(c.replay_miss){
    const mb=el('div','missbox');mb.setAttribute('role','note');
    mb.append(el('b',null,'Not in the recording'),'This claim was never run live, so replay mode has no judge answers for it. The "unclear" below is not a verdict. Run it with a live key, or pick one of the sample claims.');
    paper.append(mb);
  }

  /* the hero: the sheet, the camera move, the boxes, the room, the cloud, the wipe */
  stage=createStage(c,{on3d:mountStage3d,can3d:ev=>!!window.Plan3D||ev.sheet===FLOOR_SHEET});stageCard=c.id;
  paper.append(stage.node);

  const cols=el('div','cols');
  const left=el('div');
  const x=diffOf(c);
  const cev=curEv(c);
  const first=cev[0]||(c.evidence||[])[0]||{};
  if(c.reason&&!c.replay_miss)left.append(el('p','reason',c.reason));
  const leg=el('ol','legend');
  for(const it of cev.length?cev:(c.evidence||[])){
    const li=el('li');
    li.append(el('span','lnum mono',String(leg.childNodes.length+1)),el('span',null,it.label||''),el('span','lsheet mono',(it.sheet_number?it.sheet_number+' ':'')+(it.sheet||'')));
    leg.append(li);
  }
  if(leg.childNodes.length)left.append(leg);
  if(c.video_evidence&&c.video_evidence.frame)left.append(videoPanel(c));
  if(first.crop){
    const det=el('details','ctx');det.append(el('summary',null,'Show the raw crops sent to the judges'));
    const cmp=el('div','compare'+(x&&x.crop?'':' one'));
    const A=figure('Current, '+revLabel(first.revision),first.sheet||'',false,first.crop,'Current crop');
    let idx=0;
    for(const it of cev.length?cev:(c.evidence||[])){idx++;const b=it.box_2d_on_crop;
      if(Array.isArray(b)&&b.length===4){const bx=el('div','bbox '+vCls(c.verdict));place(bx,b);bx.append(el('span','btag mono',String(idx)));A.wrap.append(bx);}}
    cmp.append(A.f);
    if(x&&x.crop){const B=figure('Superseded, bid set',x.d.superseded_sheet||'',true,x.crop,'Superseded crop');cmp.append(B.f);}
    det.append(cmp);left.append(det);
  }

  const aside=el('div','aside');
  const seal=el('section','seal');seal.setAttribute('aria-label','Evidence seal');
  const sh=el('div','sealh');
  const hashEl=el('span','hash','seal …');
  sh.append(el('span','t','Evidence seal'),hashEl);
  sealHash(c).then(h=>{hashEl.textContent='seal '+h.slice(0,4)+'…'+h.slice(4);hashEl.title='sha256 of claim, evidence boxes and sheet ids: '+h;});
  seal.append(sh);
  const ul=el('ul','sealrows');
  const items=sealItems(c);
  for(const it of items){
    const li=el('li',it.s);
    li.append(el('span','mk',it.s==='ok'?'✓':it.s==='bad'?'✗':'–'));
    const tx=el('span','tx',it.t);
    if(it.arrow)tx.append(el('span','arrow mono',it.arrow));
    if(it.w)tx.append(el('span','why',it.w));
    li.append(tx);ul.append(li);
  }
  seal.append(ul);
  if(!c.replay_miss)aside.append(seal);
  const bad=items.filter(i=>i.s==='bad');
  if(c.verdict==='unclear')aside.append(el('div','unclear','Unclear because: '+(bad.length?bad.map(b=>(b.w||b.t)).join(' '):(c.reason||'the evidence does not settle the claim.'))));
  if((c.evidence||[]).some(e=>e.sheet===FLOOR_SHEET)){
    const vb=el('button','lbtn wide','See it in 3D');vb.type='button';
    vb.onclick=()=>{if(stage&&stage.can3d){stage.tilt();stage.node.scrollIntoView({block:'nearest'});}else location.hash='#3d';};
    aside.append(vb);
  }
  cols.append(left,aside);paper.append(cols);
  const ft=el('div','foot mono');
  ft.append(el('span',null,`cost $${Number(c.cost_usd||0).toFixed(4)}`),el('span',null,`latency ${Number(c.latency_s||0)}s`),el('span',null,c.id||''));
  paper.append(ft);
  d.append(paper);
  paintRfi(c);
  if((c.verdict==='conflict'||c.verdict==='unclear')&&!rfiState.get(c.id))fetchRfi(c);   // pre-check the addenda Q&A
  const s=Q.get('state');
  if(s==='zoom0')return;
  if(s==='landed'||s==='wipe'||s==='whole'||s==='3d'){stage.play({instant:true}).then(()=>{if(s==='wipe')stage.wipe(false,Number(Q.get('wipe')??35));if(s==='whole')stage.whole&&stage.whole();if(s==='3d')stage.tilt();});return;}
  stage.play({instant:!(animate&&fresh)});
}

/* ---------- 3D ---------- */
const view3d=mount3D({container:$('c3d'),tip:$('tip3d'),off:$('off3d'),focus:$('focus3d'),
  getCards:()=>cards,getSelId:()=>selId,onPick:id=>{selId=id;location.hash='#card='+encodeURIComponent(id);}});
window.addEventListener('resize',()=>{if($('v3d').style.display!=='none')view3d.resize();});
window.addEventListener('hashchange',applyRoute);

/* ---------- present mode: problem opening, then the product on recorded samples; → / space, ←, Esc ---------- */
const P={on:false,k:0,beat:0,busy:false,steps:[],gen:0};
function presentSteps(){
  const hero=samples.find(s=>s.card_id&&/105A/.test(s.claim))||samples[0];
  return [{k:'wall1',l:'The drawing set'},{k:'wall2',l:'Addenda'},{k:'spot',l:'Spot the difference',id:hero&&hero.card_id},
    {k:'rfi',l:'RFIs'},{k:'ask',l:'Ask instead'},
    ...samples.map(s=>({k:'sample',s,l:s.label})),{k:'digest',l:'Addendum digest'},{k:'trust',l:'Trust'}];
}
function slideHost(){let h=$('slideHost');if(!h){h=el('div','slideHost');h.id='slideHost';h.setAttribute('aria-live','polite');document.body.append(h);}return h;}
function presentHud(){
  let h=$('presentHud');
  if(!h){h=el('div','presentHud');h.id='presentHud';h.setAttribute('role','status');document.body.append(h);}
  h.textContent='';
  const st=P.steps[P.k]||{};
  const nxt=P.steps[P.k+1];
  const hint=P.busy?'checking…':st.k==='sample'&&P.beat===0&&stage&&stage.hasWipe?'→ before / after':st.k==='sample'&&P.beat<2&&stage&&stage.can3d?'→ 3D':nxt?'→ '+nxt.l:'→ finish';
  h.append(el('span','ph-n mono',`${P.k+1} of ${P.steps.length}`),el('b','ph-l',st.l||''),el('span','ph-k',hint));
  const x=el('button','ph-x','Exit');x.type='button';x.onclick=presentStop;h.append(x);
}
async function presentStart(){
  await samplesReady;
  P.steps=presentSteps();P.on=true;P.beat=0;
  P.k=Math.max(0,Math.min(P.steps.length-1,Number(Q.get('step'))||0));   // ?step= test hook
  document.body.classList.add('present');
  $('presentBtn').setAttribute('aria-pressed','true');
  sheetset();   // warm the index; the thumbnails start loading with the first slide
  presentGo();
}
function presentStop(){
  P.on=false;P.gen++;document.body.classList.remove('present','slideOn');
  $('presentBtn').setAttribute('aria-pressed','false');
  for(const id of ['presentHud','slideHost']){const n=$(id);if(n)n.remove();}
  if(location.hash==='#digest')location.hash='#cards';
  if(stage)window.dispatchEvent(new Event('resize'));
}
async function presentGo(){
  const st=P.steps[P.k];if(!st)return;
  const gen=++P.gen;P.beat=0;
  const host=slideHost();
  const scene={wall1:()=>sheetWall(1),wall2:()=>sheetWall(2),spot:()=>spotDiff(st.id,'Order three WC-2 toilets from the old sheet and two get ripped out.'),
    rfi:()=>rfiCost(),ask:()=>askInstead(),trust:()=>trust()}[st.k];
  if(scene){
    document.body.classList.add('slideOn');
    presentHud();
    const node=await scene();
    if(gen!==P.gen)return;
    host.textContent='';host.append(node);
    return;
  }
  document.body.classList.remove('slideOn');host.textContent='';
  if(st.k==='digest'){location.hash='#digest';presentHud();return;}
  if(location.hash==='#digest'||location.hash==='#3d')location.hash='#cards';
  const prev=cards.find(c=>(c.claim||'').trim().toLowerCase()===st.s.claim.trim().toLowerCase());
  if(prev&&st.seen){selId=prev.id;stageCard=null;lastDetailId=null;location.hash='#card='+encodeURIComponent(prev.id);applyRoute();presentHud();return;}
  P.busy=true;presentHud();window.scrollTo({top:0});
  await runClaim(st.s.claim);
  st.seen=true;
  if(gen!==P.gen)return;
  P.busy=false;presentHud();
}
function presentNext(){
  if(P.busy||running)return;
  const st=P.steps[P.k];
  if(st&&st.k==='sample'&&P.beat===0&&stage&&stage.hasWipe){P.beat=1;stage.wipe(true);presentHud();return;}
  if(st&&st.k==='sample'&&P.beat<2&&stage&&stage.can3d){P.beat=2;stage.tilt();presentHud();return;}
  if(P.k>=P.steps.length-1){presentStop();return;}
  P.k++;presentGo();
}
function presentPrev(){
  if(P.busy||running)return;
  const st=P.steps[P.k];
  if(st&&st.k==='sample'&&P.beat===2&&stage&&stage.hasWipe){P.beat=1;stage.wipe(false,50);presentHud();return;}
  if(st&&st.k==='sample'&&P.beat>=1&&stage){P.beat=0;stage.sheet();presentHud();return;}
  if(P.k===0)return;
  P.k--;presentGo();
}
$('presentBtn').onclick=()=>P.on?presentStop():presentStart();

/* ---------- boot ---------- */
renderStrip();
fetch('/api/cards')
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .catch(()=>fetch('./cards.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}))
  .then(async data=>{
    cards=Array.isArray(data)?data:[];
    selId=heroOf(cards);
    const want=Q.get('card');
    if(want){const hit=cards.find(c=>c.id===want)||cards.find(c=>(c.claim||'').toLowerCase().includes(want.toLowerCase()));if(hit)selId=hit.id;}
    applyRoute();renderStrip();
    await Promise.all([samplesReady,healthReady]);
    if(Q.get('run')!=null&&samples[Number(Q.get('run'))]){const h=Q.get('hold');runClaim(samples[Number(Q.get('run'))].claim,h!=null?{hold:Number(h)}:{});}
    if(Q.get('present')==='1')presentStart();
  })
  .catch(err=>{
    $('ledgerBox').textContent='';
    $('ledgerBox').append(el('div','err','Failed to load cards: '+err.message));
  });
</script>
