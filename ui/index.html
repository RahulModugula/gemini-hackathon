<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawing Claim Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{
  --board:#e4e8e7;--board-2:#f1f3f2;--chrome:#ffffff;--line:#aab3b8;--mute:#4f5a63;--text:#14191e;--on-text:#ffffff;
  --grid:rgba(31,95,214,.07);--badge:#8a5a00;
  --paper:#f5f6f4;--paper-2:#e9ebe8;--ink:#14191e;--ink-2:#46515b;--rule:#14191e;
  --red:#c8261b;--red-on-dark:#c8261b;--green:#12794a;--green-on-dark:#12794a;--amber:#ffb000;--amber-ink:#6b4700;--blue:#1f5fd6;--grey:#6b7680;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{--board:#1d2329;--board-2:#252c33;--chrome:#12161a;--line:#3a444e;--mute:#9aa7b2;--text:#eef2f5;--on-text:#14191e;
  --grid:rgba(125,180,255,.045);--badge:#ffb000;--red-on-dark:#ff5a4d;--green-on-dark:#34c586;--blue:#7db4ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--board);color:var(--text);font:15px/1.45 var(--sans);font-stretch:100%;overflow-x:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.mono{font-family:var(--mono)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.paper :focus-visible{outline-color:#1f5fd6}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:0 24px;height:52px;background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin:0;font-size:19px;font-weight:700;font-stretch:80%;letter-spacing:.2px;white-space:nowrap}
.brand i{display:inline-block;width:12px;height:12px;border:2px solid var(--amber);transform:translateY(1px);position:relative}
.brand i::after{content:"";position:absolute;left:3px;top:-6px;width:2px;height:20px;background:var(--amber)}
.replay{padding:2px 8px;border:1px solid var(--badge);border-radius:2px;font-size:12px;font-weight:600;color:var(--badge)}
.spacer{flex:1}
nav{display:flex;gap:2px;background:var(--board-2);padding:3px;border-radius:6px}
.tab{padding:6px 16px;background:transparent;border:0;border-radius:4px;font-weight:600;color:var(--mute)}
.tab.act{background:var(--text);color:var(--on-text)}
.thm{padding:5px 10px;background:transparent;border:1.5px solid var(--line);border-radius:4px;font-size:13px;font-weight:600;color:var(--mute)}

/* score strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 28px;padding:7px 24px;background:var(--board-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.strip b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.strip .grp{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.strip .grp+.grp{margin-left:auto}
.strip .gl{font-weight:600;color:var(--text)}
.strip .cnt b{font-size:15px;margin-right:4px}
.strip .cnt.hot b{color:var(--red-on-dark)}
.strip .cnt.blk b{color:var(--badge)}

/* claim bar */
.ask{padding:14px 24px 0}
.bar{display:flex;gap:8px;max-width:1200px}
#claimIn{flex:1;min-width:0;padding:11px 14px;background:var(--chrome);border:1.5px solid var(--line);border-radius:6px;color:var(--text);font-size:16px}
#claimIn::placeholder{color:var(--mute)}
#claimIn:focus-visible{border-color:var(--blue);outline-offset:0}
.btn{padding:10px 18px;background:var(--text);color:var(--on-text);border:0;border-radius:6px;font-weight:700}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--text)}
#micBtn,#vidBtn{display:flex;align-items:center;gap:8px}
#micBtn .dot{width:10px;height:10px;border-radius:50%;background:var(--red-on-dark)}
#micBtn.rec{background:var(--red);border-color:var(--red);color:#fff}
#micBtn.rec .dot{background:#fff;animation:pulse 1s infinite}
button:disabled{opacity:.55;cursor:wait}
.status{margin:10px 0 0;max-width:1200px;padding:8px 12px;background:var(--chrome);border-left:3px solid var(--blue);font-size:14px}
.status.bad{border-left-color:var(--red-on-dark);color:var(--red-on-dark);font-weight:600}

/* first-screen explainer + samples */
.lede{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;max-width:1200px;margin:0 0 12px}
.lede p{margin:0;font-size:17px;line-height:1.35;font-stretch:92%;color:var(--text);max-width:68ch}
.lede .how{font-size:13px;color:var(--mute)}
.samples{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:1200px;margin:10px 0 0}
.samples .sl{font-size:13px;color:var(--mute);margin-right:2px}
.smp{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 11px 7px;background:transparent;border:1.5px solid var(--line);border-left:4px solid var(--blue);border-radius:3px;text-align:left;line-height:1.2}
.smp b{font-size:14px;font-weight:650;font-stretch:90%}
.smp span{font-size:12px;color:var(--mute)}
.smp.q{border-left-color:var(--amber)}
.smp:hover{border-color:var(--text);border-left-color:inherit}
.smp:disabled{opacity:.5}
.missbox{margin:0 0 14px;padding:12px 14px;border:2px dashed var(--ink-2);background:var(--paper-2);font-size:15px}
.missbox b{display:block;font-size:17px;margin-bottom:4px}
.replayed{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--amber-ink);color:var(--amber-ink);font-size:11px;font-weight:600}
.blocked .stamp2{grid-column:1/-1;justify-self:start;padding:6px 16px 5px;border:4px double var(--red);color:var(--red);font-weight:800;font-stretch:112%;font-size:30px;letter-spacing:.05em;text-transform:uppercase;transform:rotate(-2.5deg);line-height:1.05}
.blocked .stamp2 small{display:block;font-size:13px;letter-spacing:.02em;text-transform:none;font-weight:700;color:#7a1710}

/* agent trace */
.trace{max-width:1200px;margin:12px 0 0;padding:12px 14px;background:var(--chrome);border:1px solid var(--line);border-radius:6px;animation:rise .25s ease-out}
.trace .tt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-bottom:10px}
.trace .tt b{color:var(--text)}
.rail{display:flex;align-items:stretch;gap:0;list-style:none;margin:0;padding:0}
.stp{flex:1 1 0;min-width:0;padding:0 8px 0 0;position:relative}
.stp .mk{display:flex;align-items:center;gap:6px;height:20px}
.stp .dotm{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none;background:var(--chrome)}
.stp .ln{flex:1;height:2px;background:var(--line)}
.stp.run .dotm{border-color:var(--amber);animation:pulse 1s infinite}
.stp.done .dotm{background:var(--green-on-dark);border-color:var(--green-on-dark)}
.stp.done .ln{background:var(--green-on-dark)}
.stp.bad .dotm{background:var(--red-on-dark);border-color:var(--red-on-dark)}
.stp .nm{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--mute);line-height:1.2}
.stp.run .nm,.stp.done .nm{color:var(--text)}
.stp .tm{display:block;font-size:12px;color:var(--mute);font-family:var(--mono);min-height:16px}
.stp.par .nm{margin-top:6px}
.pair{flex:1.4 1 0;display:flex;flex-direction:column;gap:8px;min-width:0;padding:0 14px 0 10px;margin-right:6px;border-left:2px solid var(--line);position:relative;justify-content:center}
.pair::before{content:"in parallel";position:absolute;top:-9px;left:10px;font-size:11px;color:var(--mute);background:var(--chrome);padding:0 4px;margin-left:-4px}
.pair .stp{padding:0;display:flex;align-items:center;gap:8px;flex:none}
.pair .stp .mk{height:auto}
.pair .stp .ln{display:none}
.pair .stp .row2{display:flex;gap:8px;align-items:baseline;flex:1;min-width:0}
.pair .stp .nm{margin:0}
.pair .row2 .tm{margin-left:auto}
.stp:last-child .ln,.rail>.last .ln{display:none}

/* layout */
main{padding:16px 24px 40px}
#cardsView{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.ledger{display:flex;flex-direction:column;gap:8px;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.lh{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 2px;color:var(--mute);font-size:13px}
.lh b{color:var(--text);font-size:15px;font-stretch:85%}
.row{display:flex;flex-direction:column;gap:7px;padding:11px 12px;background:var(--board-2);border:1.5px solid var(--line);border-left:5px solid var(--grey);border-radius:4px;text-align:left;width:100%;color:var(--text);transition:border-color .15s,background .15s}
.row.v-conflict{border-left-color:var(--red-on-dark)}
.row.v-consistent{border-left-color:var(--green-on-dark)}
.row:hover{border-color:var(--mute)}
.row.sel{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vw{font-weight:700;font-stretch:90%;font-size:14px}
.row.sel .mute{color:var(--ink-2)}
.mute{color:var(--mute);font-size:12px}
.claimTxt{font-size:14px;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 7px;border:1.5px solid currentColor;border-radius:2px;font-size:12px;font-weight:600;line-height:1.5}
.chip.amber{color:var(--badge)}
.row.sel .chip.amber{color:var(--amber-ink)}
.chip.spk{color:var(--blue)}
.row.sel .chip.spk{color:#1f5fd6}
.cbar{flex:1;min-width:48px;height:6px;background:rgba(255,255,255,.14);border-radius:1px;overflow:hidden}
.row.sel .cbar{background:rgba(0,0,0,.14)}
.cfill{height:100%;background:currentColor}
.heard{padding:12px;background:var(--chrome);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:8px}
.heard h3{margin:0;font-size:14px;font-stretch:90%}
.hq{display:flex;gap:8px;align-items:baseline;width:100%;padding:6px 8px;background:var(--board-2);border:1px solid var(--line);border-radius:3px;text-align:left;font-size:14px}
.hq:hover{border-color:var(--mute)}

/* the sheet */
.paper{background:#fbfcfb;color:var(--ink);border:2px solid var(--paper);border-radius:3px;padding:22px 24px 18px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.4);min-width:0}
.paper.enter{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
.shead{display:flex;gap:20px;align-items:flex-start;margin-bottom:18px}
.stamp{flex:none;padding:6px 14px 5px;border:3px double currentColor;border-radius:3px;font-weight:800;font-stretch:112%;font-size:24px;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-2deg);margin-top:4px;line-height:1.1;text-align:center}
.stamp small{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:none;font-stretch:90%}
.stamp.v-conflict{color:var(--red)}
.stamp.v-consistent{color:var(--green)}
.stamp.v-other{color:var(--grey)}
.dclaim{margin:0;font-size:28px;line-height:1.12;font-weight:700;font-stretch:88%;letter-spacing:-.005em;max-width:30ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2);align-items:center}
.meta .chip{color:#1f5fd6}
.meta .chip.amber{color:var(--amber-ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare.big{grid-template-columns:1fr}
.compare.one{grid-template-columns:minmax(0,560px)}
.fig{margin:0;min-width:0}
.fcap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 8px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600}
.fcap .mono{font-weight:400;font-size:12px;opacity:.85}
.fcap.old{background:var(--ink-2)}
.vidPanel{margin:0 0 14px;padding:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
.vidPanel h3{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.3px}
.vidPanel .imgWrap{cursor:pointer;max-width:420px}
.vidPanel video{display:block;width:100%;max-width:420px;max-height:220px;margin-top:8px;background:#000}
.vidPanel .txt{margin-top:6px;font-size:12px}
.imgWrap{position:relative;display:block;border:1.5px solid var(--ink);background:#fff;line-height:0}
.imgWrap img{display:block;width:100%;height:auto}
.bbox{position:absolute;border:2px solid var(--grey);background:rgba(107,118,128,.16);pointer-events:none}
.bbox.v-conflict{border-color:var(--red);background:rgba(217,45,32,.14)}
.bbox.v-consistent{border-color:var(--green);background:rgba(18,121,74,.14)}
.bbox.old{border-style:dashed;border-color:var(--ink-2);background:transparent}
.btag{position:absolute;top:-2px;left:-2px;padding:0 5px;font-size:11px;font-weight:600;line-height:1.5;color:#fff;background:var(--grey)}
.bbox.v-conflict .btag{background:var(--red)}
.bbox.v-consistent .btag{background:var(--green)}
.bbox.old .btag{background:var(--ink-2)}
.dbox{position:absolute;border:2px solid #e89a00;background:rgba(255,176,0,.5);box-shadow:0 0 0 4px rgba(255,176,0,.38);mix-blend-mode:multiply;pointer-events:none;border-radius:2px;animation:glow 1.6s ease-out 1}
.cmpnote{margin:8px 0 0;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.sw{display:inline-block;width:14px;height:10px;background:rgba(255,176,0,.5);border:2px solid var(--amber)}
.legend{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)}
.legend li{display:flex;gap:10px;align-items:baseline;padding:5px 2px;border-bottom:1px solid #c9cdca;font-size:14px}
.lnum{font-weight:500;min-width:16px;color:var(--ink-2);font-size:12px}
.lsheet{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--ink-2)}

/* enlarged detail: the boxed words at readable size */
.detail2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 0 10px}
.detail2.one{grid-template-columns:minmax(0,1fr)}
.zoom{position:relative;overflow:hidden;border:2px solid var(--ink);background:#fff;aspect-ratio:2/1}
.zoom img{position:absolute;max-width:none;image-rendering:auto}
.zcap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px;background:var(--ink);color:#fff;font-size:15px;font-weight:700}
.zcap.old{background:var(--ink-2)}
.zcap .mono{font-weight:400;font-size:12px;opacity:.85}
.zoom .bbox{border-width:3px;background:transparent}
.zoom .dbox{border-width:3px}
.ctx{margin-top:4px}
.ctx summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 0}
.trace.incard{margin:0;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:3px;padding:16px 18px}
.trace.incard .tt,.trace.incard .tt b{color:var(--ink)}
.trace.incard .stp .nm{color:var(--ink-2)}
.trace.incard .stp.run .nm,.trace.incard .stp.done .nm{color:var(--ink)}
.trace.incard .stp .tm{color:var(--ink-2)}
.trace.incard .stp.done .dotm{background:var(--green);border-color:var(--green)}
.trace.incard .stp.done .ln{background:var(--green)}
.trace.incard .stp .dotm{background:#fff;border-color:#aab3b8}
.trace.incard .pair::before{background:#fff;color:var(--ink-2)}
.trace.incard .pair{border-left-color:#aab3b8}

/* seal = title block */
.aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.seal{border:2px solid var(--ink);background:#fff}
.sealh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-bottom:2px solid var(--ink);background:var(--paper-2)}
.sealh .t{font-weight:700;font-stretch:90%;font-size:15px}
.hash{font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.02em;padding:1px 6px;border:1.5px solid var(--ink);background:#fff}
.sealrows{list-style:none;margin:0;padding:0}
.sealrows li{display:grid;grid-template-columns:30px 1fr;border-bottom:1px solid var(--ink);font-size:14px;line-height:1.3}
.sealrows li:last-child{border-bottom:0}
.sealrows .mk{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--ink);font-weight:800;font-size:16px}
.sealrows .tx{padding:7px 10px}
.sealrows .why{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.sealrows .ok .mk{background:#dff3e8;color:var(--green)}
.sealrows .bad .mk{background:#fbe0dd;color:var(--red)}
.sealrows .bad .tx{font-weight:600}
.sealrows .na .mk{background:var(--paper-2);color:var(--grey)}
.sealrows .na .tx{color:var(--ink-2)}
.sealrows .arrow{font-weight:700;background:rgba(255,176,0,.35);padding:0 3px}
.unclear{padding:9px 10px;border:2px solid var(--red);background:#fdeceb;color:#7a1710;font-size:14px;font-weight:600}
.loc{border:1.5px solid var(--ink);background:#fff}
.loc .lt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;font-size:13px;font-weight:600;border-bottom:1.5px solid var(--ink)}
.plan{position:relative;line-height:0}
.plan img{width:100%;height:auto;display:block;opacity:.9}
.pdot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid var(--red);background:rgba(217,45,32,.25)}
.pdot.v-consistent{border-color:var(--green);background:rgba(18,121,74,.25)}
.pdot.v-other{border-color:var(--grey)}
.lbtn{padding:4px 10px;background:var(--ink);color:var(--paper);border:0;border-radius:3px;font-weight:600;font-size:13px}
.lbtn:hover{background:#2c3944}

/* below the fold */
.reason{margin:14px 0 0;padding:10px 14px;border-left:4px solid var(--ink);background:var(--paper-2);font-size:15px;line-height:1.5;max-width:90ch}
.hact{margin-left:auto;flex:none;padding-top:6px}
.rfiBtn{padding:9px 18px;background:var(--ink);color:var(--paper);border:0;border-radius:4px;font-weight:700}
.rfiBtn.sub{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.blocked{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:14px 16px;background:#fff6dd;border:2px solid var(--amber);border-radius:3px;animation:rise .35s ease-out}
.blocked .bh{grid-column:1/-1;font-size:20px;font-weight:800;font-stretch:95%;color:#4a3000}
.blocked .bh span{display:inline-block;background:var(--amber);padding:0 6px;margin-right:6px}
.blocked blockquote{grid-column:1/-1;margin:0;padding:6px 0 6px 14px;border-left:4px solid var(--amber);font-size:16px;line-height:1.45;font-style:italic;color:#2d2000;max-width:75ch}
.blocked .bn{grid-column:1/-1;font-size:13px;color:#5d4510}
.foot{margin-top:18px;padding-top:8px;border-top:1px solid var(--ink);font-size:12px;color:var(--ink-2);display:flex;gap:18px;flex-wrap:wrap}

/* modal */
.modalBg{position:fixed;inset:0;background:rgba(8,10,12,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--paper);color:var(--ink);border:2px solid var(--paper);border-radius:3px;padding:18px;max-width:720px;width:100%;max-height:90vh;display:flex;flex-direction:column;gap:10px;animation:rise .2s ease-out}
.modal h2{margin:0;font-size:22px;font-stretch:90%}
.modal pre{margin:0;white-space:pre-wrap;overflow:auto;background:#fff;padding:12px;border:1.5px solid var(--ink);font-size:13px;line-height:1.5}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.modal .note{padding:8px 10px;background:#fff6dd;border-left:4px solid var(--amber);font-size:14px}
.modal .small{font-size:12px;color:var(--ink-2)}
.modal .btn{background:var(--ink);color:var(--paper)}
.modal .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}

/* 3D */
#v3d{display:none;position:relative;min-height:68vh;height:calc(100vh - 190px);background:#0e1318;border:1px solid var(--line);border-radius:4px;overflow:hidden}
#c3d{width:100%;height:100%;display:block}
#c3d canvas{width:100%;height:100%;display:block}
#tip3d{position:fixed;display:none;pointer-events:none;max-width:280px;padding:6px 9px;background:var(--chrome);border:1px solid var(--blue);border-radius:3px;color:#fff;font-size:12px;z-index:20}
#off3d{position:absolute;top:10px;left:10px;max-width:320px;max-height:60%;overflow:auto;padding:8px 10px;background:rgba(18,22,26,.94);border:1px solid var(--line);border-radius:3px;font-size:12px;z-index:5}
#off3d ul{margin:4px 0 0;padding-left:16px}
.err{padding:12px;background:#48141a;border:1px solid var(--red-on-dark);color:#ffdadb;border-radius:4px}

/* ===== sheet stage (assets/stage.js) ===== */
:root{--mat:#203029;--mat-2:#2a3c34;--mat-line:rgba(226,240,232,.07);--redline:#d42a1e;--add:#1f5fd6;--rem:#d96b00;--hl:#ffd21f;--paperw:#fbfcfb}
.stage{position:relative;margin:4px 0 20px}
.mat{position:relative;width:100%;aspect-ratio:16/9;max-height:max(400px,calc(100vh - 340px));overflow:hidden;border-radius:4px;background-color:var(--mat);
  background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);background-size:36px 36px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.cam{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;transition:opacity .3s}
.stage.ready .cam{opacity:1}
.sheetimg{position:absolute;inset:0;width:100%;height:100%;background:var(--paperw);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 40px 120px rgba(0,0,0,.55)}
.cropimg{position:absolute;opacity:0;transition:opacity .45s ease-out .05s}
.stage.landed .cropimg{opacity:1}
.ov{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ebox{opacity:0}
.ebox rect:first-child{fill:rgba(255,255,255,.0);stroke-width:calc(var(--u)*.42px);stroke-dasharray:1;stroke-dashoffset:1}
.stage.landed .ebox{opacity:1;transition:opacity .15s calc(var(--i)*160ms)}
.stage.landed .ebox rect:first-child{stroke-dashoffset:0;transition:stroke-dashoffset .5s cubic-bezier(.3,.7,.3,1) calc(var(--i)*160ms)}
.etag{opacity:.96}
.ebox text{fill:#fff;font:700 10px var(--sans);font-family:var(--sans);font-weight:800}
.cloud{fill:none;stroke:var(--redline);stroke-width:calc(var(--u)*.38px);stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.stage.landed .cloud{stroke-dashoffset:0;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1) .35s}
.delta{opacity:0;transform-box:fill-box;transform-origin:center}
.delta path{fill:#fff;stroke:var(--redline);stroke-width:calc(var(--u)*.3px);stroke-linejoin:round}
.delta text{fill:var(--redline);font-family:var(--sans);font-weight:800;text-anchor:middle}
.stage.landed .delta{opacity:1;transition:opacity .25s 1.3s}
.room-hl{fill:none;stroke:var(--hl);stroke-width:calc(var(--u)*1.5px);stroke-linecap:square;opacity:0;mix-blend-mode:multiply}
.room-ln{fill:none;stroke:#2a2200;stroke-width:calc(var(--u)*.22px);stroke-linecap:square;opacity:0}
.stage.landed .room-hl{opacity:.8;transition:opacity .6s .15s}
.stage.landed .room-ln{opacity:.9;transition:opacity .6s .15s}
.stage-load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#dfe9e3;font-size:16px;font-weight:600}
.stage-empty{display:flex;flex-direction:column;gap:4px;padding:28px;background:var(--mat);color:#e9f0ec;border-radius:4px;font-size:16px}
.stage-empty b{font-size:20px}
.hud{position:absolute;z-index:3;opacity:0;transition:opacity .3s}
.stage.ready .hud{opacity:1}
.hud.cap{left:14px;top:14px;display:flex;align-items:baseline;gap:10px;padding:6px 12px 7px;background:var(--paperw);color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;font-size:14px}
.hud.cap b{font-size:22px;font-weight:800;font-stretch:80%;letter-spacing:.01em}
.hud.cap .mono{font-size:12px;color:var(--ink-2)}
.hud.ctl{right:14px;top:14px;display:flex;background:rgba(20,25,30,.86);padding:3px;border-radius:5px;gap:2px}
.seg{padding:7px 13px;background:transparent;border:0;border-radius:3px;color:#dfe6e2;font-weight:650;font-size:14px}
.seg:hover{background:rgba(255,255,255,.1)}
.seg.on{background:var(--paperw);color:var(--ink)}
.seg:disabled{opacity:.35;cursor:not-allowed}
.hud.roomchip{left:14px;bottom:14px;max-width:min(560px,70%);display:flex;flex-direction:column;gap:2px;padding:9px 14px 10px;background:var(--paperw);color:var(--ink);border:1.5px solid var(--ink);border-left:8px solid var(--hl);border-radius:2px}
.roomchip b{font-size:17px;font-stretch:88%}
.roomchip .tags{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.roomchip .by{font-size:13px;color:var(--ink-2)}
.hud.legend2{right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;padding:8px 12px;background:rgba(20,25,30,.86);color:#eef3f0;border-radius:4px;font-size:13px;max-width:44%}
.lg{display:flex;align-items:center;gap:8px}
.lg i{flex:none;width:18px;height:12px;border:2.5px solid var(--red)}
.lg.cloud i{border-color:var(--redline);border-radius:6px;border-style:dotted}
.lg.room i{border-color:var(--hl);background:rgba(255,210,31,.3)}
/* wipe */
.wipe{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:62px 18px 16px;background:var(--mat)}
.wipe.in{animation:fadein .35s ease-out}
.wframe{position:relative;flex:1 1 auto;min-height:0;max-width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none;cursor:ew-resize;box-shadow:0 0 0 1.5px var(--ink),0 24px 60px rgba(0,0,0,.45);user-select:none}
.wl{position:absolute;inset:0;overflow:hidden}
.wl img{position:absolute;max-width:none;pointer-events:none}
.dmark{position:absolute;border:3px solid;border-radius:2px}
.dmark.now{border-color:var(--add);background:rgba(31,95,214,.13)}
.dmark.was{border-color:var(--rem);background:rgba(217,107,0,.15)}
.dmark .glyph{position:absolute;left:-3px;bottom:100%;min-width:22px;padding:0 5px;font-weight:800;font-size:17px;line-height:22px;text-align:center;color:#fff}
.dmark.now .glyph{background:var(--add)}
.dmark.was .glyph{background:var(--rem)}
.whandle{position:absolute;top:0;bottom:0;width:0;border-left:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translateX(-1.5px);z-index:2}
.stage.mode-wipe .roomchip,.stage.mode-wipe .legend2{display:none}
.whandle .knob{position:absolute;bottom:14px;left:-25px;width:48px;height:48px;display:grid;place-items:center;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:50%;font-weight:800;font-size:17px;letter-spacing:-.05em}
.whandle:focus-visible{outline:none}
.whandle:focus-visible .knob{outline:3px solid var(--add);outline-offset:2px}
.wtag{position:absolute;top:10px;display:flex;flex-direction:column;padding:5px 11px 6px;color:#fff;font-size:13px;line-height:1.2;z-index:1;pointer-events:none}
.wtag b{font-size:18px}
.wtag.was{left:10px;background:var(--rem)}
.wtag.now{right:10px;background:var(--add);text-align:right}
.wkey{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;justify-content:center;color:#eef3f0;font-size:16px}
.wk{display:flex;align-items:center;gap:8px}
.wk .glyph{display:inline-grid;place-items:center;width:24px;height:24px;font-weight:800;color:#fff;background:var(--add)}
.wk.was .glyph{background:var(--rem)}
.wk .words{font-weight:700;font-variant-numeric:tabular-nums}
.wsrc{font-size:13px;color:#b9c8c0}

/* ===== pipeline (assets/pipeline.js) ===== */
.pipe{background:var(--mat);color:#eef3f0;border-radius:4px;padding:22px 26px 20px;background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);background-size:36px 36px}
.pipe-h{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.pipe-claim{flex:1 1 380px;min-width:0}
.pipe-q{font-size:26px;font-weight:700;font-stretch:86%;line-height:1.15}
.pipe-mode{padding:3px 10px;border:2px solid #eef3f0;font-weight:700;font-size:14px}
.pipe.recorded .pipe-mode{border-color:var(--amber);color:var(--amber)}
.pipe-clock{font-size:20px;min-width:7ch;text-align:right}
.pipe-note{margin:10px 0 0;font-size:15px;color:#c9d6cf;max-width:80ch}
.flow{list-style:none;margin:30px 0 8px;padding:0;display:grid;grid-template-columns:1fr 1fr 1.25fr 1.45fr 1.1fr;gap:34px;align-items:center}
.col{position:relative;min-width:0}
.col>ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.col:not(:last-child)::after{content:"";position:absolute;top:50%;right:-34px;width:34px;height:2px;background:rgba(238,243,240,.3)}
.c-judges>ol{padding-left:16px;border-left:2px solid rgba(238,243,240,.3)}
.c-judges::before{content:"";position:absolute;top:50%;left:-34px;width:34px;height:2px;background:rgba(238,243,240,.3)}
.c-judges>ol::before{content:"in parallel";position:absolute;top:-24px;left:16px;font-size:13px;color:#b9c8c0}
.pipe.judging .c-judges>ol{border-left-color:var(--amber)}
.pn{position:relative;display:flex;flex-direction:column;gap:3px;min-height:84px;justify-content:center;padding:12px 14px 12px 36px;border:2px solid rgba(238,243,240,.3);border-radius:4px;background:rgba(0,0,0,.14)}
.pn.done{animation:litup .3s ease-out}
.pn-dot{position:absolute;left:13px;top:17px;width:12px;height:12px;border-radius:50%;border:2px solid rgba(238,243,240,.55)}
.pn-name{font-size:18px;font-stretch:88%;line-height:1.15}
.pn-sub{font-size:14px;color:#c9d6cf;line-height:1.25}
.pn-t{font-size:12px;color:#b9c8c0}
.pn.run{border-color:var(--amber);box-shadow:0 0 0 5px rgba(255,176,0,.16)}
.pn.run .pn-dot{background:var(--amber);border-color:var(--amber);animation:pulse .9s infinite}
.pn.done{background:var(--paperw);border-color:var(--paperw);color:var(--ink)}
.pn.done .pn-sub,.pn.done .pn-t{color:var(--ink-2)}
.pn.done .pn-dot{background:var(--green);border-color:var(--green)}
.pn.done.v-conflict .pn-sub{color:var(--red);font-weight:700}
.pn.done.v-consistent .pn-sub{color:var(--green);font-weight:700}
.pn.bad{border-color:var(--red-on-dark)}
.pn.bad .pn-dot{background:var(--red);border-color:var(--red)}
.ticks{list-style:none;margin:10px 0 0;padding:0}
.tk{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid rgba(238,243,240,.13);font-size:15px;animation:rise .25s ease-out}
.tk-m{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:2px;font-style:normal;font-weight:800;font-size:13px;background:rgba(238,243,240,.15)}
.tk.ok .tk-m{background:#1f9a5e;color:#fff}
.tk.bad .tk-m{background:var(--red);color:#fff}
.tk.run .tk-m{background:var(--amber);animation:pulse .9s infinite}
.tk.info{color:#c9d6cf}
.vslot{display:grid;place-items:center;min-height:150px;border:2px dashed rgba(238,243,240,.3);border-radius:4px}
.vwait{color:#b9c8c0;font-size:16px}
.vstamp{display:flex;flex-direction:column;align-items:center;padding:10px 18px 8px;background:var(--paperw);border:6px double currentColor;font-weight:800;font-stretch:112%;font-size:34px;letter-spacing:.05em;text-transform:uppercase;line-height:1;transform:rotate(-4deg);animation:stampin .42s cubic-bezier(.2,1.5,.4,1)}
.vstamp small{margin-top:6px;font-size:13px;letter-spacing:.02em;text-transform:none;font-stretch:90%}
.vstamp.v-conflict{color:var(--red)}
.vstamp.v-consistent{color:var(--green)}
.vstamp.v-other{color:var(--grey)}
.vfail{padding:12px;color:#ffd9d4;font-weight:700;text-align:center}
.emptyState{display:flex;flex-direction:column;gap:6px;padding:40px 28px;border:2px dashed var(--line);border-radius:4px;font-size:16px;color:var(--mute)}
.emptyState b{font-size:22px;color:var(--text)}
.lbtn.wide{padding:10px 14px;font-size:15px}
.htext{flex:1;min-width:0}
.legend{counter-reset:none;padding:0}

/* ===== 3D (assets/view3d.js) ===== */
#v3d{background:var(--mat)}
.focus3d{position:absolute;right:12px;top:12px;max-width:360px;display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:var(--paperw);color:var(--ink);border-left:8px solid var(--grey);border-radius:2px;font-size:14px;z-index:5}
.focus3d b{font-size:20px;font-stretch:90%}
.focus3d.v-conflict{border-left-color:var(--red)}
.focus3d.v-consistent{border-left-color:var(--green)}
.focus3d .fr{font-weight:700}
#off3d{background:rgba(20,25,30,.9);color:#eef3f0}
#off3d button{background:none;border:0;padding:2px 0;color:#eef3f0;text-align:left;text-decoration:underline;font-size:13px}
.flat3d{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:12px;overflow:auto}
.flatmsg{margin:0;color:#eef3f0;font-size:15px}
.flatwrap{position:relative;line-height:0;max-width:1100px}
.flatwrap img{width:100%;height:auto}
.flatwrap .pdot{padding:0;cursor:pointer}
.flatwrap .pdot.sel{width:22px;height:22px;margin:-11px 0 0 -11px}

/* ===== present mode ===== */
.present-btn kbd{font:600 11px var(--mono);padding:0 4px;border:1px solid currentColor;border-radius:2px;margin-left:4px}
.present-btn[aria-pressed="true"]{background:var(--text);color:var(--on-text)}
body.present{font-size:20px}
body.present .strip,body.present .ask,body.present .ledger,body.present .cols,body.present .foot,body.present .blkslot .bn{display:none}
body.present main{padding:14px 28px 90px}
body.present #cardsView{grid-template-columns:1fr}
body.present .paper{padding:18px 22px 12px}
body.present .shead{align-items:center;gap:28px;margin-bottom:14px}
body.present .stamp{font-size:76px;padding:6px 22px 4px;border-width:7px}
body.present .stamp small{font-size:20px}
body.present .dclaim{font-size:40px;max-width:36ch}
body.present .meta{font-size:20px}
body.present .meta .chip{font-size:18px}
body.present .mat{max-height:calc(100vh - 330px)}
body.present .roomchip .tags{font-size:24px}
body.present .roomchip b{font-size:20px}
body.present .roomchip .by,body.present .legend2{font-size:16px}
body.present .wkey{font-size:20px}
body.present .pipe-q{font-size:38px}
body.present .pn-name{font-size:24px}
body.present .pn-sub,body.present .tk{font-size:19px}
body.present .pipe-note{font-size:20px}
body.present .vstamp{font-size:72px}
body.present .flow{margin-top:44px}
body.present .rfiBtn{font-size:20px}
.presentHud{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:22px;padding:12px 28px;background:var(--ink);color:#fff;font-size:20px}
.ph-n{font-size:18px;color:#c9d6cf}
.ph-l{font-size:22px;font-stretch:90%}
.ph-k{margin-left:auto;font-weight:700;color:var(--amber)}
.ph-x{padding:6px 14px;background:transparent;border:1.5px solid #fff;border-radius:3px;color:#fff;font-weight:700;font-size:16px}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes litup{from{box-shadow:0 0 0 8px rgba(255,255,255,.35)}to{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
#off3d{top:auto;bottom:10px}
.lede{margin:0 0 8px}.lede p{font-size:15.5px}.ask{padding-top:10px}.samples{margin-top:8px}.smp{padding:4px 10px 5px}
.paper{padding-top:16px}.shead{margin-bottom:12px}
@keyframes stampin{from{opacity:0;transform:scale(2.4) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-4deg)}}
@media (max-width:1100px){.flow{grid-template-columns:1fr 1fr;gap:22px}.col::after,.c-judges::before{display:none}.c-checks,.c-verdict{grid-column:span 1}}
@media (max-width:700px){
  .mat{aspect-ratio:4/5;max-height:none}
  .hud.cap{left:8px;top:8px;font-size:12px;gap:6px;padding:4px 8px}.hud.cap b{font-size:17px}.hud.cap .mono{display:none}
  .hud.ctl{left:8px;right:8px;top:auto;bottom:8px;justify-content:space-between}.seg{flex:1;padding:8px 4px;font-size:13px}
  .hud.roomchip{left:8px;right:8px;bottom:58px;max-width:none;padding:7px 10px}.roomchip .tags{font-size:16px}
  .hud.legend2{display:none}
  .wipe{padding:48px 8px 62px}.wkey{font-size:13px;gap:4px 12px}.wtag b{font-size:15px}.wtag{font-size:11px}
  .pipe{padding:16px}.pipe-q{font-size:20px}
  .flow{grid-template-columns:1fr;gap:12px}.col>ol{gap:10px}.c-judges>ol::before{top:-20px}.c-judges{margin-top:16px}
  .pn{min-height:0}
  .presentHud{gap:10px;padding:10px 14px;font-size:15px}.ph-l{font-size:16px}
  .present-btn kbd{display:none}
  body.present .stamp{font-size:44px}body.present .dclaim{font-size:26px}
}
@media (max-width:480px){.present-btn{display:none}.brand{font-size:15px}}
@media (prefers-reduced-motion:reduce){.cam{transition:none!important}.stage .ebox,.stage .cloud,.stage .delta,.stage .cropimg,.stage .room-hl,.stage .room-ln{transition:none!important}}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes glow{from{box-shadow:0 0 0 6px rgba(255,176,0,.55)}to{box-shadow:0 0 0 0 rgba(255,176,0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1180px){.cols{grid-template-columns:1fr}.aside{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}}
@media (max-width:900px){#cardsView{grid-template-columns:1fr}.ledger{position:relative;top:auto;max-height:none;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;scroll-snap-type:x proximity}.ledger .row{flex:0 0 260px;scroll-snap-align:start}.lh{display:none}.heard{flex:0 0 240px}}
@media (max-width:700px){
  .detail2{grid-template-columns:1fr}
  .top{padding:0 12px;gap:8px;height:48px}.tab{padding:6px 10px}.thm{padding:4px 8px}.brand{font-size:16px}.replay{display:none}
  .strip{padding:6px 16px;gap:4px 14px;font-size:12px}.strip .grp+.grp{margin-left:0}
  .ask{padding:12px 16px 0}main{padding:12px 16px 32px}
  .paper{padding:16px 14px 14px}
  .blocked{padding:12px}.blocked .bh{font-size:18px}.blocked blockquote{font-size:15px}
  .shead{flex-direction:column;gap:10px}.hact{margin-left:0;padding-top:0}.dclaim{font-size:22px}
  .compare{grid-template-columns:1fr}.aside{grid-template-columns:1fr}
  .rail{flex-direction:column;gap:8px}.stp{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;padding:0}.stp .mk{height:auto}.stp .ln{display:none}.stp .nm{margin:0}.pair{padding:0;border:0;margin:0}.pair::before{display:none}.pair .stp{display:grid}.pair .row2{display:contents}
  .bar{flex-wrap:wrap}#claimIn{flex-basis:100%}.btn{flex:1}
  .ledger .row{flex-basis:240px}
  .samples{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}.samples .sl{display:none}.smp{flex:0 0 auto;scroll-snap-align:start}
  .lede .how{display:none}
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand"><i aria-hidden="true"></i>Drawing Claim Checker</h1>
  <span id="replayBadge" class="replay" hidden>replay mode</span>
  <span class="spacer"></span>
  <button id="presentBtn" class="thm present-btn" type="button" aria-pressed="false" title="Step through the sample claims with → and space. Esc leaves.">Present <kbd>P</kbd></button>
  <button id="thmBtn" class="thm" type="button" aria-pressed="false">Dark</button>
  <nav aria-label="Views">
    <button id="tabCards" class="tab act" type="button">Cards</button>
    <button id="tab3d" class="tab" type="button">3D</button>
  </nav>
</header>
<div id="strip" class="strip" aria-label="Scoreboard"></div>
<section class="ask">
  <div class="lede"><p>Check a question or statement against the current drawing set, after every addendum, before you send an RFI or price the work.</p>
  <span class="how">Each answer is boxed on the sheet, judged by two Gemini models and verified by code. Disagreement means unclear.</span></div>
  <div class="bar">
    <input id="claimIn" type="text" maxlength="500" placeholder="Say or type a claim, e.g. All the water closets in Toilet 105A are type WC-2." aria-label="Say or type a claim">
    <button id="goBtn" class="btn" type="button">Check claim</button>
    <button id="micBtn" class="btn ghost" type="button" title="Record a claim"><span class="dot" aria-hidden="true"></span><span id="micTxt">Mic</span></button>
    <button id="vidBtn" class="btn ghost" type="button" title="Check a site video">Video</button>
    <input id="vidIn" type="file" accept="video/mp4,video/quicktime" hidden aria-label="Site video file">
  </div>
  <div id="samples" class="samples" aria-label="Sample claims"></div>
  <div id="status" class="status" role="status" hidden></div>
  <div id="trace" class="trace" hidden aria-live="polite"></div>
</section>
<main>
  <section id="cardsView">
    <div id="ledgerBox" class="ledger" role="list" aria-label="Claims ledger"></div>
    <div id="detail" aria-live="polite"></div>
  </section>
  <section id="v3d">
    <div id="c3d"></div>
    <div id="tip3d"></div>
    <div id="off3d" hidden></div>
    <div id="focus3d" hidden></div>
  </section>
</main>
<script type="module">
/* three.js is imported lazily by assets/view3d.js, so the cards still work offline or without WebGL. */
import {createStage} from './assets/stage.js';
import {createPipeline} from './assets/pipeline.js';
import {mount3D,FLOOR_SHEET} from './assets/view3d.js';

/* All data reaches the DOM through textContent / attributes set by property. No HTML-string sinks anywhere. */
const $=id=>document.getElementById(id);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const vCls=v=>v==='conflict'?'v-conflict':v==='consistent'?'v-consistent':'v-other';
const vWord=v=>v==='conflict'?'Conflict':v==='consistent'?'Consistent':'Unclear';
const SHEET_W=3024,SHEET_H=2160;
const Q=new URLSearchParams(location.search);   // test hooks: ?card=&state=zoom0|landed|wipe|whole&wipe=&run=&hold=&present=

let cards=[],selId=null,heard=null,samples=[],cacheMode=null,stage=null,stageCard=null;
const TRACE=document.getElementById('trace');
const rfiState=new Map();   // card id -> {status:'pending'|'draft'|'blocked'|'na', ...}
let metrics=null;

$('tabCards').onclick=()=>{location.hash=selId?`#card=${encodeURIComponent(selId)}`:'#cards';};
$('tab3d').onclick=()=>{location.hash='#3d';};
function setTheme(t){document.documentElement.dataset.theme=t;const b=$('thmBtn');b.textContent=t==='dark'?'Light':'Dark';b.setAttribute('aria-pressed',String(t==='dark'));try{localStorage.setItem('theme',t);}catch(e){}}
{let t='light';try{t=localStorage.getItem('theme')||'light';}catch(e){}setTheme(t);}
$('thmBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const setStatus=(t,bad)=>{const s=$('status');s.hidden=!t;s.className='status'+(bad?' bad':'');s.textContent=t||'';};
async function api(path,opts){
  const r=await fetch(path,opts);
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)?(r.status===503?'Service unavailable: '+j.error:j.error):'HTTP '+r.status);
  return j;
}

/* ---------- helpers over a card ---------- */
const changedByAddendum=c=>!!(c.changed_by_addendum||judges(c).some(j=>j.changed_by_addendum));
const checkOf=(c,name)=>(c.checks||[]).find(k=>k.check===name);
const judges=c=>(c.checks||[]).filter(k=>k.by&&k.by!=='code'&&(k.verdict==='conflict'||k.verdict==='consistent'||k.verdict==='unclear'));
const judgeName=by=>{const n=String(by||'').replace(/^gemini-\d+-/,'');return n?n[0].toUpperCase()+n.slice(1):'Judge';};
const revLabel=r=>r==='dwg'?'Original':/^add(\d+)$/.test(r||'')?'Add '+r.slice(3):(r||'unknown issue');
const curEv=c=>(c.evidence||[]).filter(e=>e.revision!=='dwg');
const supEv=c=>(c.evidence||[]).filter(e=>e.revision==='dwg');
function diffOf(c){
  const d=checkOf(c,'addendum_diff');
  if(!d)return null;
  const crop=d.superseded_crop||(supEv(c)[0]||{}).crop||null;
  return {d,crop,boxes:d.diff_boxes||{current:[],superseded:[]}};
}
function topWords(m,prefer){
  const ks=Object.keys(m||{});
  const pref=ks.filter(k=>prefer.has(k)&&k.length>1);
  return (pref.length?pref:ks.sort((a,b)=>m[b]-m[a]).slice(0,1)).slice(0,2);
}
function diffSummary(c){
  const x=diffOf(c);if(!x)return null;
  const q=new Set(judges(c).flatMap(j=>j.quoted_words||[]));
  const o=topWords(x.d.only_superseded,q),n=topWords(x.d.only_current,q);
  if(!o.length&&!n.length)return null;
  return (o.join(', ')||'nothing')+' → '+(n.join(', ')||'nothing');
}
function sealItems(c){
  const out=[];
  const ev=curEv(c)[0]||(c.evidence||[])[0];
  if(ev){
    const sn=ev.sheet_number||ev.sheet;
    out.push({s:'ok',t:`Found on sheet ${sn} (current, ${revLabel(ev.revision)})`,w:ev.sheet_number?`${ev.sheet} in the drawing set`:''});
  }else out.push({s:'bad',t:'No sheet matched the claim',w:'Search returned no candidate sheet.'});
  const g=checkOf(c,'grounding');
  if(g)out.push(g.pass?{s:'ok',t:'Boxes land on PDF words'}:{s:'bad',t:'Boxes do not land on PDF words',w:g.detail});
  else out.push({s:'na',t:'Box grounding not recorded'});
  const js=judges(c);
  if(js.length>=2){
    const [a,b]=js;
    const agree=a.verdict===b.verdict;
    out.push(agree?{s:'ok',t:`${judgeName(a.by)} ✓ · ${judgeName(b.by)} ✓ agree`,w:`Both say ${a.verdict}`}
      :{s:'bad',t:`${judgeName(a.by)} (${a.verdict}) and ${judgeName(b.by)} (${b.verdict}) disagree`,w:'Judges must agree, so the card is unclear.'});
  }else if(js.length===1)out.push({s:'na',t:`${judgeName(js[0].by)} only: no second judge on this card`});
  else out.push({s:'na',t:'No judge verdicts recorded'});
  const cu=checkOf(c,'currency');
  if(cu)out.push(cu.pass?{s:'ok',t:'Revision current'}:{s:'bad',t:'Revision is not current',w:cu.detail});
  else if(ev)out.push({s:'na',t:`Evidence is on ${revLabel(ev.revision)}; currency check not recorded`});
  const dm=checkOf(c,'dimension');
  if(dm)out.push(dm.pass?{s:'ok',t:'Dimension math agrees',w:dm.detail}:{s:'bad',t:'Dimension math disagrees',w:dm.detail});
  const sum=diffSummary(c);
  if(sum)out.push({s:'ok',t:'Addendum diff: ',arrow:sum});
  else out.push({s:'na',t:'No earlier issue of this sheet to diff'});
  return out;
}

/* ---------- score strip ---------- */
function renderStrip(){
  const s=$('strip');s.textContent='';
  if(metrics&&typeof metrics==='object'){
    const g=el('div','grp');
    g.append(el('span','gl',metrics.label||'Eval'));
    const add=(k,v)=>{const sp=el('span');sp.append(k+' ');sp.append(el('b',null,v));g.append(sp);};
    if(typeof metrics.accuracy==='number'){
      let v=Math.round(metrics.accuracy*1000)/10+'%';
      if(Array.isArray(metrics.ci)&&metrics.ci.length===2)v+=` (95% CI ${Math.round(metrics.ci[0]*1000)/10}–${Math.round(metrics.ci[1]*1000)/10})`;
      add('accuracy',v);
    }
    if(metrics.n!=null)add('n =',String(metrics.n));
    if(typeof metrics.p50_latency_s==='number')add('p50 latency',metrics.p50_latency_s+' s');
    if(typeof metrics.cost_per_card_usd==='number')add('cost per card','$'+metrics.cost_per_card_usd);
    if(metrics.as_of)g.append(el('span',null,'as of '+metrics.as_of));
    s.append(g);
  }
  const conflicts=cards.filter(c=>c.verdict==='conflict').length;
  const blocked=[...rfiState.values()].filter(r=>r.status==='blocked').length;
  const g2=el('div','grp');
  g2.append(el('span','gl','This ledger'));
  const cnt=(n,l,cls)=>{const sp=el('span','cnt '+(cls||''));sp.append(el('b',null,String(n)),l);g2.append(sp);};
  cnt(cards.length,'cards');
  cnt(conflicts,'conflicts found',conflicts?'hot':'');
  cnt(blocked,'RFIs blocked',blocked?'blk':'');
  s.append(g2);
}
fetch('/api/metrics').then(r=>r.ok?r.json():null).then(m=>{metrics=m;renderStrip();}).catch(()=>{});

/* ---------- live pipeline (SSE) ---------- */
/* Cosmetic pacing only: events are revealed at least PACE_MS apart (longer before a judge finishes, so the two
   parallel lanes are visible) because a recorded run delivers them all at once. Times shown are the server's. */
const PACE_MS=280,JUDGE_DONE_MS=650;
function streamCheck(claim,o={}){
  return new Promise((resolve,reject)=>{
    if(stage){stage.destroy();stage=null;stageCard=null;}
    const d=$('detail');d.textContent='';
    const pl=createPipeline(claim,{recorded:false});
    d.append(pl.node);
    if(cacheMode==='replay')pl.setRecorded('Model answers are replayed from recorded calls. Search, cropping and every code check run now, on this machine.');
    const q=[];let timer=null,finished=null,last=0,applied=0;
    const es=new EventSource('/api/check/stream?claim='+encodeURIComponent(claim));
    const gapFor=ev=>ev&&ev.status==='done'&&(ev.step==='judge_a'||ev.step==='judge_b')?JUDGE_DONE_MS:PACE_MS;
    const pump=()=>{
      if(timer)return;
      const tick=()=>{
        timer=null;
        if(o.hold!=null&&applied>=o.hold)return;       // test hook: freeze mid-run for a screenshot
        if(q.length){const ev=q.shift();
          if(ev.replay&&applied===0)pl.setRecorded('Replayed from the recorded ledger. No model calls, nothing re-run: the events below are the recorded run’s steps.');
          pl.apply(ev);applied++;last=Date.now();timer=setTimeout(tick,gapFor(q[0]));return;}
        if(finished)finished();
      };
      timer=setTimeout(tick,Math.max(0,gapFor(q[0])-(Date.now()-last)));
    };
    es.addEventListener('step',e=>{try{q.push(JSON.parse(e.data));pump();}catch(x){}});
    es.addEventListener('card',e=>{es.close();let c;try{c=JSON.parse(e.data);}catch(x){reject(new Error('bad card'));return;}
      finished=()=>{finished=null;pl.finish(c).then(()=>resolve(c));};pump();});
    es.addEventListener('error',e=>{
      if(e.data){es.close();let m='check failed';try{m=JSON.parse(e.data).error;}catch(x){}
        finished=()=>{pl.fail('Check failed: '+m);reject(new Error('Service unavailable: '+m));};pump();}
      else if(es.readyState===EventSource.CLOSED||es.readyState===EventSource.CONNECTING){es.close();pl.fail('The connection closed before the card arrived.');reject(new Error('stream closed before the card arrived'));}
    });
  });
}

/* ---------- ledger + routing ---------- */
function heroOf(list){
  const isSup=c=>c.verdict==='conflict'&&diffOf(c)&&diffOf(c).crop;
  return (list.find(isSup)||list.find(c=>c.verdict==='conflict')||list[0]||{}).id||null;
}
function addCards(list){
  const ids=new Set(list.map(c=>c.id));
  cards=list.concat(cards.filter(c=>!ids.has(c.id)));
  if(list.length)selId=list[0].id;
  if(location.hash&&location.hash!=='#cards'&&location.hash!=='#3d')location.hash='#cards';
  view3d.update();applyRoute();renderStrip();
}
let running=false;
async function runClaim(claim,o){
  running=true;
  $('goBtn').disabled=$('claimIn').disabled=true;
  document.querySelectorAll('.smp').forEach(b=>b.disabled=true);
  setStatus('');
  try{
    const card=await streamCheck(claim,o);
    $('claimIn').value='';
    addCards([card]);
    if(!P.on&&stage){const r=stage.node.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)stage.node.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
    return card;
  }catch(e){setStatus('Check failed: '+e.message,true);return null;}
  finally{running=false;$('goBtn').disabled=$('claimIn').disabled=false;document.querySelectorAll('.smp').forEach(b=>b.disabled=false);}
}
function submitClaim(){
  const claim=$('claimIn').value.trim();
  if(!claim||running)return;
  runClaim(claim);
}
$('goBtn').onclick=submitClaim;
function renderSamples(list){
  const box=$('samples');box.textContent='';
  if(!Array.isArray(list)||!list.length)return;
  samples=list;
  box.append(el('span','sl','Try one:'));
  for(const s of list){
    const b=el('button','smp'+(s.kind==='question'?' q':''));b.type='button';
    b.append(el('b',null,s.label),el('span',null,s.why||s.claim));
    b.title=s.claim;
    b.onclick=()=>{if($('goBtn').disabled)return;$('claimIn').value=s.claim;submitClaim();};
    box.append(b);
  }
}
const samplesReady=fetch('/api/samples').then(r=>r.ok?r.json():[]).then(renderSamples).catch(()=>{});
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);};
document.addEventListener('keydown',e=>{
  if(document.querySelector('.modalBg')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'&&!typing()){e.preventDefault();$('claimIn').focus();return;}
  if((e.key==='p'||e.key==='P')&&!typing()){e.preventDefault();P.on?presentStop():presentStart();return;}
  if(!P.on)return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'||e.key==='Enter'){if(e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='slider'&&e.key!==' ')return;e.preventDefault();presentNext();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){if(e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='slider')return;e.preventDefault();presentPrev();}
  else if(e.key==='Escape'){e.preventDefault();presentStop();}
});
$('claimIn').addEventListener('keydown',e=>{if(e.key==='Enter')submitClaim();});

let rec=null;
$('micBtn').onclick=async()=>{
  if(rec){rec.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){setStatus('Recording is not supported in this browser.',true);return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){setStatus('Microphone unavailable: '+e.message,true);return;}
  const chunks=[];
  rec=new MediaRecorder(stream);
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    const mime=(rec.mimeType||'audio/webm').split(';')[0];
    rec=null;$('micBtn').classList.remove('rec');$('micTxt').textContent='Mic';
    setStatus('Transcribing and checking…');$('micBtn').disabled=true;
    try{
      const res=await api('/api/audio',{method:'POST',headers:{'Content-Type':mime},body:new Blob(chunks,{type:mime})});
      const n=res.claims.length;
      setStatus(n?'':'No checkable claims heard.');
      heard=res.claims.map((c,i)=>({claim:c.claim,speaker:c.speaker,t:c.t_start_s,card:(res.cards[i]||{}).id}));
      addCards(res.cards);
    }catch(e){setStatus('Audio failed: '+e.message,true);}
    finally{$('micBtn').disabled=false;}
  };
  rec.start();$('micBtn').classList.add('rec');$('micTxt').textContent='Stop';setStatus('Recording… press Stop when done.');
};

$('vidBtn').onclick=()=>$('vidIn').click();
$('vidIn').onchange=async()=>{
  const f=$('vidIn').files[0];$('vidIn').value='';
  if(!f)return;
  const sheet=(prompt('Drawing sheet for this walk (optional, e.g. P101)','')||'').trim();
  $('vidBtn').disabled=true;setStatus('Reading the video and checking each claim\u2026');
  try{
    const res=await api('/api/video'+(sheet?'?sheet='+encodeURIComponent(sheet):''),{method:'POST',headers:{'Content-Type':f.type||'video/mp4'},body:f});
    const n=res.claims.length;
    setStatus(n?'Found '+n+' claim'+(n>1?'s':'')+' in '+res.video_s+'s of video':'No checkable claims in the video.');
    addCards(res.cards);
  }catch(e){setStatus('Video failed: '+e.message,true);}
  finally{$('vidBtn').disabled=false;}
};

function showModal(title,body,note){
  const prev=document.activeElement;
  const bg=el('div','modalBg');
  const m=el('div','modal');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',title);
  const acts=el('div','acts');
  const cp=el('button','btn ghost','Copy');cp.type='button';
  const cl=el('button','btn','Close');cl.type='button';
  const close=()=>{bg.remove();document.removeEventListener('keydown',esc);if(prev&&prev.focus)prev.focus();};
  const esc=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',esc);
  cl.onclick=close;
  bg.onclick=e=>{if(e.target===bg)close();};
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(body);cp.textContent='Copied';}catch(e){cp.textContent='Copy failed';}};
  acts.append(cp,cl);
  m.append(el('h2',null,title));
  if(note)m.append(el('div','note',note));
  m.append(el('pre','mono',body),el('div','small','Draft only. Nothing is sent.'),acts);
  bg.append(m);document.body.append(bg);cl.focus();
}
const prettyAnswer=s=>{const m=/^add(\d+)\s+p(\d+)\s+Q(\d+)$/i.exec(s||'');return m?`Addendum ${m[1]} p.${m[2]} Q${m[3]}`:(s||'an addendum');};
async function fetchRfi(c){
  const cur=rfiState.get(c.id);
  if(cur&&cur.status!=='error')return cur;
  rfiState.set(c.id,{status:'pending'});
  try{
    const r=await api('/api/rfi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({card_id:c.id})});
    rfiState.set(c.id,r);
  }catch(e){rfiState.set(c.id,{status:'error',error:e.message});}
  renderStrip();
  if(selId===c.id&&parseHash().tab==='cards'&&paintRfi.cur&&paintRfi.cur.id===c.id)paintRfi(c);
  return rfiState.get(c.id);
}
function openRfi(c){
  const r=rfiState.get(c.id);
  if(r&&r.text){
    if(r.status==='blocked')showModal('RFI not needed',r.text,`Already answered in ${prettyAnswer(r.answered_by)}: "${r.quote}"`);
    else showModal('RFI draft',r.text);
  }
}
const healthReady=fetch('/api/health').then(r=>r.json()).then(h=>{cacheMode=h&&h.cache_mode;if(cacheMode==='replay')$('replayBadge').hidden=false;}).catch(()=>{});

function parseHash(){
  const h=location.hash.slice(1);
  if(h==='3d')return {tab:'3d'};
  if(h.startsWith('card=')){try{return {tab:'cards',card:decodeURIComponent(h.slice(5))};}catch(e){return {tab:'cards'};}}
  return {tab:'cards'};
}
let lastDetailId=null;
function applyRoute(){
  const r=parseHash();
  if(r.card&&cards.some(c=>c.id===r.card))selId=r.card;
  if(!selId&&cards.length)selId=heroOf(cards);
  const is3d=r.tab==='3d';
  $('tabCards').classList.toggle('act',!is3d);
  $('tab3d').classList.toggle('act',is3d);
  $('cardsView').style.display=is3d?'none':'';
  $('v3d').style.display=is3d?'block':'none';
  if(is3d){
    if(stage){stage.destroy();stage=null;stageCard=null;}
    view3d.start().then(()=>{view3d.update();view3d.resize();});
  }else{
    renderLedger();
    renderDetail(true);
  }
}

function renderLedger(){
  const box=$('ledgerBox');
  box.textContent='';
  const lh=el('div','lh');lh.append(el('b',null,'Claims'),el('span',null,cards.length+(cards.length===1?' card':' cards')));
  box.append(lh);
  if(heard&&heard.length){
    const hd=el('div','heard');
    hd.append(el('h3',null,'Heard '+heard.length+' claim'+(heard.length>1?'s':'')));
    for(const h of heard){
      const b=el('button','hq');b.type='button';
      b.append(el('span','chip spk',h.speaker||'Speaker'),el('span',null,'“'+h.claim+'”'));
      b.onclick=()=>{if(h.card){selId=h.card;location.hash='#card='+encodeURIComponent(h.card);}};
      hd.append(b);
    }
    box.append(hd);
  }
  if(!cards.length){box.append(el('div','mute','No claims yet. Type one above.'));return;}
  let selBtn=null;
  for(const c of cards){
    const btn=el('button','row '+vCls(c.verdict)+(c.id===selId?' sel':''));
    btn.type='button';btn.setAttribute('role','listitem');
    if(c.id===selId)btn.setAttribute('aria-current','true');
    const top=el('div','rtop');
    top.append(el('span','vw',vWord(c.verdict)));
    const pct=Math.round((Number(c.confidence)||0)*100);
    const bar=el('div','cbar');const fill=el('div','cfill');fill.style.width=pct+'%';bar.append(fill);
    top.append(bar,el('span','mute mono',pct+'%'));
    btn.append(top,el('div','claimTxt',c.claim||''));
    const chips=el('div','chips');
    if(c.speaker)chips.append(el('span','chip spk',c.speaker));
    if(changedByAddendum(c))chips.append(el('span','chip amber','Changed by addendum'));
    if(c.seal)chips.append(el('span','mute mono','seal '+c.seal+'…'));
    if(chips.childNodes.length)btn.append(chips);
    btn.onclick=()=>{
      selId=c.id;
      const h=`#card=${encodeURIComponent(c.id)}`;
      if(location.hash!==h)location.hash=h;
      else{renderLedger();renderDetail(true);}
    };
    box.append(btn);
    if(c.id===selId)selBtn=btn;
  }
  if(selBtn){if(getComputedStyle(box).flexDirection==='column'){if(box.scrollHeight>box.clientHeight)box.scrollTop=Math.max(0,selBtn.offsetTop-box.clientHeight/3);}
    else box.scrollLeft=Math.max(0,selBtn.offsetLeft-16);}
}

async function sealHash(c){
  if(c.seal)return c.seal;
  try{
    const payload=JSON.stringify([c.claim,(c.evidence||[]).map(e=>[e.sheet,e.bbox])]);
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(payload));
    return [...new Uint8Array(buf)].slice(0,4).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return '--------';}
}

const clampBox=b=>{const cl=v=>Math.max(0,Math.min(1000,Number(v)||0));
  return [cl(Math.min(b[0],b[2])),cl(Math.min(b[1],b[3])),cl(Math.max(b[0],b[2])),cl(Math.max(b[1],b[3]))];};
function place(div,b){const [y0,x0,y1,x1]=clampBox(b);
  div.style.top=(y0/10)+'%';div.style.left=(x0/10)+'%';div.style.height=((y1-y0)/10)+'%';div.style.width=((x1-x0)/10)+'%';}

/* a window (0..1000 crop units) around the evidence boxes, padded, at least 150 units wide, 2:1 */
function zoomWindow(bs){
  let y0=1e9,x0=1e9,y1=-1e9,x1=-1e9;
  for(const b of bs){const [a,bb,cc,dd]=clampBox(b);y0=Math.min(y0,a);x0=Math.min(x0,bb);y1=Math.max(y1,cc);x1=Math.max(x1,dd);}
  let w=Math.max(110,(x1-x0)*1.3),h=Math.max(40,(y1-y0)*1.3);
  if(w<h*2.6)w=h*2.6;else h=w/2.6;
  w=Math.min(w,1000);h=Math.min(h,1000);
  const cx=(x0+x1)/2,cy=(y0+y1)/2;
  const L=Math.max(0,Math.min(1000-w,cx-w/2)),T=Math.max(0,Math.min(1000-h,cy-h/2));
  return {x:L,y:T,w,h};
}
function zoomFig(capL,capR,old,src,win,boxes){
  const f=el('figure','fig');
  const cap=el('figcaption','zcap'+(old?' old':''));cap.append(el('span',null,capL),el('span','mono',capR));
  const z=el('div','zoom');
  const img=el('img');img.alt=capL+' (enlarged detail)';img.src=src;
  img.style.width=(1000/win.w*100)+'%';img.style.left=(-win.x/win.w*100)+'%';
  img.style.height=(1000/win.h*100)+'%';img.style.top=(-win.y/win.h*100)+'%';
  img.onload=()=>{const ar=(win.w*img.naturalWidth)/(win.h*img.naturalHeight);if(ar>0&&isFinite(ar))z.style.aspectRatio=String(ar);};
  z.append(img);
  for(const o of boxes){const [y0,x0,y1,x1]=clampBox(o.b);const dv=el('div',o.cls);
    dv.style.left=((x0-win.x)/win.w*100)+'%';dv.style.top=((y0-win.y)/win.h*100)+'%';
    dv.style.width=((x1-x0)/win.w*100)+'%';dv.style.height=((y1-y0)/win.h*100)+'%';
    if(o.tag)dv.append(el('span','btag mono',o.tag));z.append(dv);}
  f.append(cap,z);return f;
}
function figure(capL,capR,old,src,alt){
  const f=el('figure','fig');
  const cap=el('figcaption','fcap'+(old?' old':''));cap.append(el('span',null,capL),el('span','mono',capR));
  const wrap=el('div','imgWrap');
  if(src){const img=el('img');img.src=src;img.alt=alt;wrap.append(img);}
  if(src){wrap.tabIndex=0;wrap.setAttribute('role','button');wrap.title='Click to enlarge or shrink';wrap.style.cursor='zoom-in';
    const tg=()=>{const cm=f.parentNode;if(cm)cm.classList.toggle('big');};
    wrap.onclick=tg;wrap.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg();}};}
  f.append(cap,wrap);
  return {f,wrap};
}

const fmtT=t=>{const s=Math.max(0,Math.floor(Number(t)||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function videoPanel(c){
  const ve=c.video_evidence;
  const p=el('section','vidPanel');p.setAttribute('aria-label','Site video evidence');
  p.append(el('h3',null,'Site video \u00b7 '+fmtT(ve.t_s)));
  const wrap=el('div','imgWrap');
  const img=el('img');img.src=ve.frame;img.alt='Video frame at '+fmtT(ve.t_s);
  wrap.append(img);
  if(Array.isArray(ve.box_2d)&&ve.box_2d.length===4){
    const bx=el('div','bbox '+vCls(c.verdict));place(bx,ve.box_2d);
    bx.append(el('span','btag mono','V'));wrap.append(bx);
  }
  p.append(wrap);
  if(ve.text_read)p.append(el('div','txt mono','read: '+ve.text_read));
  if(c.video_url){
    const v=el('video');v.src=c.video_url;v.controls=true;v.preload='metadata';v.muted=true;
    wrap.title='Click to play the video from '+fmtT(ve.t_s);
    wrap.onclick=()=>{v.currentTime=Number(ve.t_s)||0;v.play().catch(()=>{});};
    p.append(v);
  }
  return p;
}

/* ---------- card detail: head, sheet stage, evidence list, seal ---------- */
function paintRfi(c){
  paintRfi.cur=c;
  const act=paintRfi.act,blk=paintRfi.blk;
  if(!act||!blk)return;
  act.textContent='';blk.textContent='';
  if(!(c.verdict==='conflict'||c.verdict==='unclear'))return;
  const r=rfiState.get(c.id);
  if(r&&r.status==='blocked'){
    const bl=el('div','blocked');bl.setAttribute('role','note');
    const stp=el('div','stamp2','RFI blocked');stp.append(el('small',null,'Already answered in '+prettyAnswer(r.answered_by)));
    bl.append(stp);
    const bh=el('div','bh');bh.append(el('span',null,'Addendum answer'),prettyAnswer(r.answered_by));
    bl.append(bh,el('blockquote',null,'“'+(r.quote||'')+'”'),el('div','bn','The bid documents already settle this question, so the RFI is blocked. Nothing was sent.'));
    blk.append(bl);
    const sb=el('button','rfiBtn sub','Show RFI text anyway');sb.type='button';sb.onclick=()=>openRfi(c);act.append(sb);
  }else{
    const rb=el('button','rfiBtn',r&&r.status==='pending'?'Checking addenda…':'Draft RFI');rb.type='button';
    rb.disabled=!!(r&&r.status==='pending');
    rb.onclick=async()=>{rb.disabled=true;rb.textContent='Drafting…';const rr=await fetchRfi(c);
      if(rr.status==='error')setStatus(/CacheMiss/.test(rr.error)?'The addenda check for this RFI is not in the recording. It needs a live run.':'RFI failed: '+rr.error,true);else if(rr.status==='draft')openRfi(c);};
    act.append(rb);
  }
}

function renderDetail(animate){
  const d=$('detail');
  const c=cards.find(x=>x.id===selId)||cards[0];
  if(!c){
    if(stage){stage.destroy();stage=null;stageCard=null;}
    d.textContent='';
    const em=el('div','emptyState');
    em.append(el('b',null,'No claims checked yet'),el('span',null,'Pick a sample above or type a claim. The answer opens here on the drawing sheet.'));
    d.append(em);return;
  }
  if(stage&&stageCard===c.id&&d.querySelector('.paper')){paintRfi(c);return;}   // same card: keep the stage where it is
  if(stage){stage.destroy();stage=null;}
  d.textContent='';
  selId=c.id;
  const paper=el('article','paper');   // no entrance animation: the camera move is the one moment of motion
  const fresh=lastDetailId!==c.id;
  lastDetailId=c.id;

  const head=el('div','shead');
  const st=el('div','stamp '+vCls(c.verdict));st.append(vWord(c.verdict));
  st.append(el('small',null,Math.round((Number(c.confidence)||0)*100)+'% confidence'));
  const ht=el('div','htext');
  ht.append(el('h2','dclaim',c.claim||''));
  const meta=el('div','meta');
  if(c.speaker)meta.append(el('span','chip',c.speaker));
  if(changedByAddendum(c))meta.append(el('span','chip amber','Changed by addendum'));
  const sp=(c.spec_refs||[]);if(sp.length)meta.append(el('span','mono','Spec '+sp.join(', ')));
  if(c.replayed)meta.append(el('span','replayed','replayed'));
  ht.append(meta);
  const act=el('div','hact');
  head.append(st,ht,act);paper.append(head);
  const blk=el('div','blkslot');paper.append(blk);
  paintRfi.act=act;paintRfi.blk=blk;

  if(c.replay_miss){
    const mb=el('div','missbox');mb.setAttribute('role','note');
    mb.append(el('b',null,'Not in the recording'),'This claim was never run live, so replay mode has no judge answers for it. The "unclear" below is not a verdict. Run it with a live key, or pick one of the sample claims.');
    paper.append(mb);
  }

  /* the hero: the sheet, the camera move, the boxes, the room, the cloud, the wipe */
  stage=createStage(c);stageCard=c.id;
  paper.append(stage.node);

  const cols=el('div','cols');
  const left=el('div');
  const x=diffOf(c);
  const cev=curEv(c);
  const first=cev[0]||(c.evidence||[])[0]||{};
  if(c.reason&&!c.replay_miss)left.append(el('p','reason',c.reason));
  const leg=el('ol','legend');
  for(const it of cev.length?cev:(c.evidence||[])){
    const li=el('li');
    li.append(el('span','lnum mono',String(leg.childNodes.length+1)),el('span',null,it.label||''),el('span','lsheet mono',(it.sheet_number?it.sheet_number+' ':'')+(it.sheet||'')));
    leg.append(li);
  }
  if(leg.childNodes.length)left.append(leg);
  if(c.video_evidence&&c.video_evidence.frame)left.append(videoPanel(c));
  if(first.crop){
    const det=el('details','ctx');det.append(el('summary',null,'Show the raw crops sent to the judges'));
    const cmp=el('div','compare'+(x&&x.crop?'':' one'));
    const A=figure('Current, '+revLabel(first.revision),first.sheet||'',false,first.crop,'Current crop');
    let idx=0;
    for(const it of cev.length?cev:(c.evidence||[])){idx++;const b=it.box_2d_on_crop;
      if(Array.isArray(b)&&b.length===4){const bx=el('div','bbox '+vCls(c.verdict));place(bx,b);bx.append(el('span','btag mono',String(idx)));A.wrap.append(bx);}}
    cmp.append(A.f);
    if(x&&x.crop){const B=figure('Superseded, bid set',x.d.superseded_sheet||'',true,x.crop,'Superseded crop');cmp.append(B.f);}
    det.append(cmp);left.append(det);
  }

  const aside=el('div','aside');
  const seal=el('section','seal');seal.setAttribute('aria-label','Evidence seal');
  const sh=el('div','sealh');
  const hashEl=el('span','hash','seal …');
  sh.append(el('span','t','Evidence seal'),hashEl);
  sealHash(c).then(h=>{hashEl.textContent='seal '+h.slice(0,4)+'…'+h.slice(4);hashEl.title='sha256 of claim, evidence boxes and sheet ids: '+h;});
  seal.append(sh);
  const ul=el('ul','sealrows');
  const items=sealItems(c);
  for(const it of items){
    const li=el('li',it.s);
    li.append(el('span','mk',it.s==='ok'?'✓':it.s==='bad'?'✗':'–'));
    const tx=el('span','tx',it.t);
    if(it.arrow)tx.append(el('span','arrow mono',it.arrow));
    if(it.w)tx.append(el('span','why',it.w));
    li.append(tx);ul.append(li);
  }
  seal.append(ul);
  if(!c.replay_miss)aside.append(seal);
  const bad=items.filter(i=>i.s==='bad');
  if(c.verdict==='unclear')aside.append(el('div','unclear','Unclear because: '+(bad.length?bad.map(b=>(b.w||b.t)).join(' '):(c.reason||'the evidence does not settle the claim.'))));
  if((c.evidence||[]).some(e=>e.sheet===FLOOR_SHEET)){
    const vb=el('button','lbtn wide','See it in 3D');vb.type='button';
    vb.onclick=()=>{location.hash='#3d';};
    aside.append(vb);
  }
  cols.append(left,aside);paper.append(cols);
  const ft=el('div','foot mono');
  ft.append(el('span',null,`cost $${Number(c.cost_usd||0).toFixed(4)}`),el('span',null,`latency ${Number(c.latency_s||0)}s`),el('span',null,c.id||''));
  paper.append(ft);
  d.append(paper);
  paintRfi(c);
  if((c.verdict==='conflict'||c.verdict==='unclear')&&!rfiState.get(c.id))fetchRfi(c);   // pre-check the addenda Q&A
  const s=Q.get('state');
  if(s==='zoom0')return;
  if(s==='landed'||s==='wipe'||s==='whole'){stage.play({instant:true}).then(()=>{if(s==='wipe')stage.wipe(false,Number(Q.get('wipe')??35));if(s==='whole')stage.whole&&stage.whole();});return;}
  stage.play({instant:!(animate&&fresh)});
}

/* ---------- 3D ---------- */
const view3d=mount3D({container:$('c3d'),tip:$('tip3d'),off:$('off3d'),focus:$('focus3d'),
  getCards:()=>cards,getSelId:()=>selId,onPick:id=>{selId=id;location.hash='#card='+encodeURIComponent(id);}});
window.addEventListener('resize',()=>{if($('v3d').style.display!=='none')view3d.resize();});
window.addEventListener('hashchange',applyRoute);

/* ---------- present mode: the scripted demo, stepped with → / space, out with Esc ---------- */
const P={on:false,i:0,beat:0,busy:false};
function presentHud(){
  let h=$('presentHud');
  if(!h){h=el('div','presentHud');h.id='presentHud';h.setAttribute('role','status');document.body.append(h);}
  h.textContent='';
  const s=samples[P.i];
  h.append(el('span','ph-n mono',`${P.i+1} of ${samples.length}`),el('b','ph-l',s?s.label:''),
    el('span','ph-k',P.busy?'checking…':(P.beat===0&&stage&&stage.hasWipe?'→ before / after':P.i<samples.length-1?'→ next claim':'→ finish')));
  const x=el('button','ph-x','Exit');x.type='button';x.onclick=presentStop;h.append(x);
}
async function presentStart(){
  await samplesReady;
  if(!samples.length){setStatus('Present mode needs the sample claims, and none loaded.',true);return;}
  P.on=true;P.i=0;P.beat=0;
  document.body.classList.add('present');
  $('presentBtn').setAttribute('aria-pressed','true');
  if(location.hash==='#3d')location.hash='#cards';
  presentRun();
}
function presentStop(){
  P.on=false;document.body.classList.remove('present');
  $('presentBtn').setAttribute('aria-pressed','false');
  const h=$('presentHud');if(h)h.remove();
  if(stage)window.dispatchEvent(new Event('resize'));
}
async function presentRun(){
  const s=samples[P.i];if(!s)return;
  P.busy=true;P.beat=0;presentHud();
  window.scrollTo({top:0});
  await runClaim(s.claim);
  P.busy=false;presentHud();
}
function presentShow(i){
  const s=samples[i];if(!s)return;
  const c=cards.find(k=>(k.claim||'').trim().toLowerCase()===s.claim.trim().toLowerCase());
  if(!c){presentRun();return;}
  P.beat=0;selId=c.id;stageCard=null;lastDetailId=null;
  location.hash='#card='+encodeURIComponent(c.id);
  presentHud();
}
function presentNext(){
  if(P.busy)return;
  if(P.beat===0&&stage&&stage.hasWipe){P.beat=1;stage.wipe(true);presentHud();return;}
  if(P.i>=samples.length-1){presentStop();return;}
  P.i++;presentRun();
}
function presentPrev(){
  if(P.busy)return;
  if(P.beat===1&&stage){P.beat=0;stage.sheet();presentHud();return;}
  if(P.i===0)return;
  P.i--;presentShow(P.i);
}
$('presentBtn').onclick=()=>P.on?presentStop():presentStart();

/* ---------- boot ---------- */
renderStrip();
fetch('/api/cards')
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .catch(()=>fetch('./cards.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}))
  .then(async data=>{
    cards=Array.isArray(data)?data:[];
    selId=heroOf(cards);
    const want=Q.get('card');
    if(want){const hit=cards.find(c=>c.id===want)||cards.find(c=>(c.claim||'').toLowerCase().includes(want.toLowerCase()));if(hit)selId=hit.id;}
    applyRoute();renderStrip();
    await Promise.all([samplesReady,healthReady]);
    if(Q.get('run')!=null&&samples[Number(Q.get('run'))]){const h=Q.get('hold');runClaim(samples[Number(Q.get('run'))].claim,h!=null?{hold:Number(h)}:{});}
    if(Q.get('present')==='1')presentStart();
  })
  .catch(err=>{
    $('ledgerBox').textContent='';
    $('ledgerBox').append(el('div','err','Failed to load cards: '+err.message));
  });
</script>
